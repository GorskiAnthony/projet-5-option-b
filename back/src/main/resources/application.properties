# Credentials externalisés via variables d'environnement (valeurs par défaut pour le dev local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mdd?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:oc_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
# ATTENTION : ddl-auto=create recrée le schéma à chaque démarrage — utiliser update ou validate en production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create

server.port=9000

# Sérialisation Jackson : dates en ISO-8601 (ex: "2024-01-15T10:30:00") et non en tableau numérique
spring.jackson.serialization.write-dates-as-timestamps=false

# Mot de passe de l'utilisateur de test — surchargeable via APP_INIT_USER_PASSWORD
app.init.user.password=${APP_INIT_USER_PASSWORD:Test1234!}

# Secret JWT externalisé via variable d'environnement JWT_SECRET en production
jwt.secret=${JWT_SECRET:aGVsbG93b3JsZHRoaXNpc215c2VjcmV0a2V5Zm9ybWRkYXBwbGljYXRpb24=}
jwt.expiration=86400

# Origine CORS autorisée — surchargeable via CORS_ALLOWED_ORIGIN en production
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
