<div class="auth-page">
  <div class="auth-page__mobile-logo">
    <img src="assets/logo_p6.png" alt="MDD" />
  </div>

  <div class="auth-card">
    <a class="back-btn" routerLink="/" aria-label="Retour">&#8592;</a>
    <h1 class="auth-card__title">Se connecter</h1>

    <form class="auth-form" (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="form-group">
        <label class="form-label" for="identifier">E-mail ou nom d'utilisateur</label>
        <input
          id="identifier"
          class="form-input"
          type="text"
          formControlName="identifier"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input
          id="password"
          class="form-input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <p class="auth-error">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primary btn--full" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
