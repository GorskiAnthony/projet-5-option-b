<div class="auth-page">
  <div class="auth-page__mobile-logo">
    <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" aria-label="MDD">
      <rect x="0" y="0" width="100" height="58" rx="14" fill="#7B61FF"/>
      <polygon points="20,58 8,76 34,58" fill="#7B61FF"/>
      <text x="50" y="34" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial,sans-serif">MDD</text>
    </svg>
  </div>

  <div class="auth-card">
    <a class="back-btn" routerLink="/" aria-label="Retour">&#8592;</a>
    <h1 class="auth-card__title">Se connecter</h1>

    <form class="auth-form" (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="form-group">
        <label class="form-label" for="identifier">E-mail ou nom d'utilisateur</label>
        <input
          id="identifier"
          class="form-input"
          type="text"
          formControlName="identifier"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input
          id="password"
          class="form-input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <p class="auth-error">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primary btn--full" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
