<app-navbar />

<main class="topics">
  <h1 class="sr-only">Thèmes</h1>

  @if (loading()) {
    <p class="topics__empty">Chargement...</p>
  } @else if (topics().length === 0) {
    <p class="topics__empty">Aucun thème disponible.</p>
  } @else {
    <div class="topics__grid">
      @for (topic of topics(); track topic.id) {
        <div class="topic-card">
          <h2 class="topic-card__title">{{ topic.name }}</h2>
          <p class="topic-card__description">{{ topic.description }}</p>
          @if (topic.subscribed) {
            <button
              class="btn btn--subscribed"
              (click)="toggleSubscription(topic)"
              [attr.aria-label]="'Se désabonner de ' + topic.name"
            >
              Se désabonner
            </button>
          } @else {
            <button
              class="btn btn--primary"
              (click)="toggleSubscription(topic)"
              [attr.aria-label]="'S\'abonner à ' + topic.name"
            >
              S'abonner
            </button>
          }
        </div>
      }
    </div>
  }
</main>
